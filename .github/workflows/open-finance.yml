# Robô do Open Finance: traz os lançamentos dos bancos (Meu Pluggy) para o app de finanças.
# Por enquanto só roda quando é chamado (diagnóstico → prévia → importar); depois de aprovado, passa a rodar todo dia.
# O registro deste fluxo é público: o robô só escreve contagens, nunca valores ou descrições.
name: Open Finance
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'diagnostico, previa ou importar'
        required: true
        default: diagnostico
      desde:
        description: 'lançamentos a partir de (AAAA-MM-DD)'
        required: false
        default: '2026-09-01'
permissions:
  contents: read
jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Robô do Open Finance
        env:
          MODO: ${{ inputs.modo }}
          DESDE: ${{ inputs.desde }}
          PLUGGY_CLIENT_ID: ${{ secrets.PLUGGY_CLIENT_ID }}
          PLUGGY_CLIENT_SECRET: ${{ secrets.PLUGGY_CLIENT_SECRET }}
          PLUGGY_ITEMS: ${{ secrets.PLUGGY_ITEMS }}
          DF_CLAUDE_CHAVE: ${{ secrets.DF_CLAUDE_CHAVE }}
        run: node financas-app/openfinance/robo.mjs
