# Vigia de segurança: todo dia ataca o app no ar como um estranho faria (só com a chave pública) e confere que tudo
# continua fechado. Se algo abrir, este fluxo falha e o GitHub manda e-mail. Não usa nenhum segredo.
name: Vigia de segurança
on:
  schedule:
    - cron: '17 11 * * *' # todo dia, 8h17 em Brasília
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Nada de senha, chave ou CPF no repositório
        run: python3 financas-app/ferramentas/vigia_segredos.py
      - name: O app no ar continua fechado para estranhos
        run: node financas-app/ferramentas/vigia_online.mjs
