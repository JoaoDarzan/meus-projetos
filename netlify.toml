# Publica o site da Darzan Produções no Netlify (só o site: o app de finanças fica no GitHub Pages)
[build]
  publish = "darzan-producoes"

# lembrete diário que mantém o Supabase do app de finanças acordado
[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# o app de finanças NÃO fica mais no Netlify (só o site): quem abrir /financas vai para o app no GitHub Pages,
# que é o único endereço do app (a versão velha que estava aqui não abre mais)
[[redirects]]
  from = "/financas"
  to = "https://joaodarzan.github.io/meus-projetos/financas/"
  status = 301
  force = true

[[redirects]]
  from = "/financas/*"
  to = "https://joaodarzan.github.io/meus-projetos/financas/:splat"
  status = 301
  force = true

# o site também não abre dentro de outro site
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
