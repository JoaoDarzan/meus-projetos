<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Foto de perfil — Darzan Produções</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Manrope:wght@600&display=swap" rel="stylesheet">
<style>
/* Foto de perfil 800x800 (o YouTube mostra em círculo). */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 800px; height: 800px; overflow: hidden; background: #0d0b0a; }
.p { width: 800px; height: 800px; display: grid; place-items: center; position: relative;
  background: radial-gradient(circle at 50% 42%, rgba(214,168,95,.22), transparent 62%), #0d0b0a; }
.anel { width: 560px; height: 560px; border-radius: 50%; border: 6px solid #d6a85f; display: grid; place-items: center;
  box-shadow: 0 0 80px rgba(214,168,95,.18), inset 0 0 60px rgba(214,168,95,.08); }
.d { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 400px; line-height: 1; color: #d6a85f; padding-bottom: 30px; }
.nome { position: absolute; bottom: 150px; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: .45em; color: #f0cf94; padding-left: .45em; background: #0d0b0a; padding: 0 18px 0 30px; }
</style>
</head>
<body><div class="p"><div class="anel"><span class="d">D</span></div><span class="nome">DARZAN</span></div></body>
</html>
